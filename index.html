<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: rgb(2, 29, 30);
        color: rgb(127, 240, 255);
        display: flex;
        flex-direction: column;
        align-items: center;

    }
    #mensaje{
       font-size: 20px;
    }

    /* Posicionamiento relativo necesario en las celdas */
td {
    position: relative; 
}

/* Estado base de las coordenadas (ocultas) */
.coordenada {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.5); /* Empieza pequeño */
    font-size: 12px;
    font-family: monospace;
    font-weight: bold;
    color: rgb(127, 240, 255);
    opacity: 0;
    pointer-events: none; /* Evita que el texto bloquee los clics en la celda */
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Animación fluida de rebote */
    
    /* Efecto Neón Cyan */

}

/* Estado activo de las coordenadas (visibles) */
.coordenada.visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1); /* Crece a su tamaño normal */
}
</style>
<body>
    <h1>Path Finder</h1>
    <table id="tabla">
    </table>
    <p id="mensaje"></p>
</body>
<script src="./index.js"></script>
</html>
